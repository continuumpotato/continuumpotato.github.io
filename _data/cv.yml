    Experience:
      - company: Saint-Gobain Research North America
        position: Senior Research Engineer, Aerospace R&D
        location: Northborough, MA
        start_date: 2024-01
        highlights:
          - "**Load-bearing windshield design.** Developed parametrized 3D finite-element models (ABAQUS, Python) to define load cases and evaluate structural load-bearing windshield designs for aircraft, working cross-functionally to translate performance requirements into design parameters."
          - Used these models to identify critical design parameters and their effect on performance metrics, and validated FE predictions against mechanical tests on windshield sections.
          - Developed automated FE workflows incorporating manufacturing defects to evaluate their effect on windshield performance; invention disclosures were submitted based on these simulations.
          - "**Material models for knitted composites.** Developed analytical and numerical material models for the anisotropic mechanical behavior of thermoplastic composites reinforced with knitted fibers, and designed and ran the experimental program to calibrate them."
          - Deployed the model to make accurate stress and deflection predictions on manufactured parts, enabling a 50% weight reduction on redesign.
          - "**Test method development.** Established a material screening pipeline between three global manufacturing plants and the R&D center to accelerate the evaluation of new materials."

      - company: University of Pennsylvania
        position: Graduate Student Research Assistant
        location: Philadelphia, PA
        start_date: 2019-07
        end_date: 2023-12
        summary: "Dissertation: Mechanics-Informed Optimization for Enhanced Adhesion and Toughness"
        highlights:
          - Developed gradient-based shape optimization for adhesive pillars to maximize adhesion; fabricated and tested optimized shapes, which reached a near-ideal interfacial stress distribution.
          - Developed a neural-network surrogate-based optimization scheme for the adherend shape of single shear-lap adhesive joints, maximizing force capacity while maintaining joint stiffness by manipulating the interfacial peel stress distribution.
          - Leveraged disorder in a hexagonal foam-like internal structure to engineer attachment structures with enhanced adhesion strength, using a simulated annealing optimization scheme.
          - Contributed to 3D printing and mechanical characterization of biodegradable structures containing cellulose nanofibers (CNFs) and other natural additives.

      - company: University of Pennsylvania
        position: Research Assistant
        location: Philadelphia, PA
        start_date: 2018-01
        end_date: 2019-05
        highlights:
          - Developed an experimental methodology to characterize the fracture toughness of Capillary Rise Infiltration (CaRI) nanocomposite films using Double Cantilever Beam (DCB) testing, and analyzed fracture surfaces to identify toughening mechanisms.

